<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>BD Brand Market — Management System</title>
<style>
:root{
  --bg:#F5F4F0;
  --surface:#FFFFFF;
  --border:#E3E0D8;
  --ink:#22262B;
  --muted:#6B7078;
  --primary:#1E3A3A;
  --primary-ink:#FFFFFF;
  --accent:#C97A2B;
  --accent-ink:#FFFFFF;
  --success:#2F7D5C;
  --success-bg:#E7F3ED;
  --danger:#B3402F;
  --danger-bg:#FBEAE6;
  --warn:#B98A1C;
  --warn-bg:#FBF1DD;
  --radius:10px;
  --nav-h:60px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
body{-webkit-tap-highlight-color:transparent;}
button,input,select,textarea{font-family:inherit;font-size:15px;}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--primary);color:var(--primary-ink);
  padding:14px 16px calc(14px);display:flex;align-items:center;justify-content:space-between;}
.topbar .title{font-weight:700;font-size:16px;}
.topbar .sub{font-size:11px;opacity:.75;margin-top:1px;}
.topbar button.icon{background:transparent;border:none;color:var(--primary-ink);font-size:20px;padding:6px 8px;cursor:pointer;border-radius:8px;}
.topbar button.icon:active{background:rgba(255,255,255,.15);}

/* Bottom nav - fixed, same position always */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:var(--nav-h);
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;max-width:480px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-decoration:none;color:var(--muted);font-size:11px;gap:2px;padding-top:6px;}
.bottomnav a .ic{font-size:20px;line-height:1;}
.bottomnav a.active{color:var(--primary);font-weight:700;}

/* Layout helpers */
.content{padding:14px 16px 8px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.card.accent-left{border-left:4px solid var(--accent);}
.card.danger-left{border-left:4px solid var(--danger);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;}
.stat .n{font-size:22px;font-weight:700;}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px;}
h1{font-size:18px;margin:4px 0 12px;}
h2{font-size:15px;margin:0 0 8px;}
.muted{color:var(--muted);font-size:13px;}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600;}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);}
textarea{resize:vertical;min-height:60px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;
  padding:11px 16px;font-weight:600;cursor:pointer;width:100%;margin-top:12px;min-height:44px;}
.btn-primary{background:var(--accent);color:var(--accent-ink);}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--ink);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-sm{width:auto;padding:8px 12px;font-size:13px;margin-top:0;min-height:36px;}
.row{display:flex;gap:8px;}
.row>.btn{flex:1;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.b-pending{background:var(--warn-bg);color:var(--warn);}
.b-approved{background:#E4EEF8;color:#2F5D8A;}
.b-issued{background:#EDE6F8;color:#6B3FA0;}
.b-completed{background:var(--success-bg);color:var(--success);}
.b-rejected,.b-cancelled{background:var(--danger-bg);color:var(--danger);}
.b-reported{background:var(--warn-bg);color:var(--warn);}
.b-assigned{background:#E4EEF8;color:#2F5D8A;}
.b-in_progress{background:#EDE6F8;color:#6B3FA0;}
.list-item{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;}
.list-item:last-child{border-bottom:none;}
.list-item .name{font-weight:600;font-size:14px;}
.list-item .meta{font-size:12px;color:var(--muted);margin-top:2px;}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;}
.tab{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:13px;white-space:nowrap;cursor:pointer;}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.ac-wrap{position:relative;}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 2px);background:#fff;border:1px solid var(--border);
  border-radius:8px;max-height:200px;overflow-y:auto;z-index:40;box-shadow:0 6px 18px rgba(0,0,0,.08);}
.ac-item{padding:10px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--border);}
.ac-item:last-child{border-bottom:none;}
.ac-item:active{background:var(--bg);}
.ac-item .sub{font-size:11px;color:var(--muted);}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 16px);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:100;
  max-width:90%;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.2);}
.toast.err{background:var(--danger);}
.toast.ok{background:var(--success);}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;display:inline-block;}
.spinner.dark{border:2px solid rgba(0,0,0,.15);border-top-color:var(--primary);}
@keyframes spin{to{transform:rotate(360deg);}}
.skel{background:linear-gradient(90deg,#eee,#f5f5f5,#eee);background-size:200% 100%;
  animation:sk 1.2s ease-in-out infinite;border-radius:6px;height:14px;margin:6px 0;}
@keyframes sk{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;}
.sheet{background:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;animation:sheetup .18s ease-out;}
@keyframes sheetup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.sheet .sheet-head h2{margin:0;}
.close-x{background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;padding:4px 8px;}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--border);font-size:15px;cursor:pointer;}
.menu-item:last-child{border-bottom:none;}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{background:#fff;border-radius:16px;padding:28px 22px;width:100%;max-width:360px;border:1px solid var(--border);}
.login-logo{width:52px;height:52px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:20px;margin:0 auto 14px;}
.login-title{text-align:center;font-weight:700;font-size:17px;}
.login-sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:10px;}
.err-box{background:var(--danger-bg);color:var(--danger);font-size:13px;padding:10px 12px;border-radius:8px;margin-top:10px;}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://wbgikykspfsxngdkyqce.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xCuEkHm4mKqEp_lNcYU6uQ_6cmJu7H0';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const app = document.getElementById('app');
let state = {
  session: null,
  profile: null,
  sections: [],
  route: 'dashboard',
};

/* ---------- helpers ---------- */
function esc(s){ return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, type=''){
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}
function fmtDate(d){ if(!d) return '—'; const dt = new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) + ' ' + dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function sectionName(id){ const s = state.sections.find(x=>x.id===id); return s ? s.name : '—'; }
function badge(status){ return `<span class="badge b-${status}">${status.replace('_',' ')}</span>`; }
function setLoading(btn, loading, label){
  if(loading){ btn.dataset.label = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span> Please wait...'; btn.disabled = true; }
  else { btn.innerHTML = btn.dataset.label || label; btn.disabled = false; }
}

async function callRpc(name, args){
  const { data, error } = await sb.rpc(name, args);
  if(error) throw new Error(error.message || 'Something went wrong');
  return data;
}
async function callFn(name, body){
  const { data, error } = await sb.functions.invoke(name, { body });
  if(error){
    // supabase-js gives a generic message for non-2xx responses; the real
    // reason is in error.context (the raw Response) — read it out.
    let msg = error.message || 'Request failed';
    try{
      if(error.context && typeof error.context.json === 'function'){
        const parsed = await error.context.json();
        if(parsed?.error) msg = parsed.error;
      }
    } catch(_e){ /* body wasn't JSON, keep generic message */ }
    throw new Error(msg);
  }
  if(data?.error) throw new Error(data.error);
  return data;
}

/* ---------- autocomplete component ---------- */
function attachAutocomplete(inputEl, listEl, searchFn, onPick){
  let timer;
  inputEl.addEventListener('input', () => {
    clearTimeout(timer);
    const q = inputEl.value.trim();
    if(q.length < 1){ listEl.innerHTML=''; listEl.style.display='none'; return; }
    timer = setTimeout(async () => {
      const results = await searchFn(q);
      if(!results.length){ listEl.innerHTML = '<div class="ac-item muted">No match found</div>'; listEl.style.display='block'; return; }
      listEl.innerHTML = results.map((r,i) => `<div class="ac-item" data-i="${i}"><div>${esc(r.label)}</div><div class="sub">${esc(r.sub||'')}</div></div>`).join('');
      listEl.style.display = 'block';
      [...listEl.children].forEach((el,i) => el.onclick = () => { onPick(results[i]); listEl.style.display='none'; });
    }, 220);
  });
  document.addEventListener('click', (e) => { if(!listEl.contains(e.target) && e.target !== inputEl) listEl.style.display='none'; });
}
async function searchItems(q){
  const { data } = await sb.from('items').select('id,name,item_code,unit,current_stock').eq('is_active', true).ilike('name', `%${q}%`).limit(8);
  return (data||[]).map(i => ({ id:i.id, label:`${i.name} (${i.item_code})`, sub:`Stock: ${i.current_stock} ${i.unit}`, raw:i }));
}
async function searchMachines(q){
  const { data } = await sb.from('machines').select('id,machine_name,asset_id,section_id').eq('is_active', true).ilike('machine_name', `%${q}%`).limit(8);
  return (data||[]).map(m => ({ id:m.id, label:`${m.machine_name} (${m.asset_id})`, sub: sectionName(m.section_id), raw:m }));
}

/* ---------- auth ---------- */
async function tryLogin(employeeId, password, formEl){
  const errBox = formEl.querySelector('.err-box');
  if(errBox) errBox.remove();
  const btn = formEl.querySelector('button[type=submit]');
  setLoading(btn, true);
  try{
    if(!employeeId || !password) throw new Error('Enter Employee ID and Password');
    const info = await callRpc('get_login_info', { p_login_id: employeeId.trim() });
    if(info.status === 'inactive'){ showLoginError(formEl, 'Your account is not authorized.'); return; }
    if(info.status !== 'ok' || !info.email){ showLoginError(formEl, 'Invalid Employee ID or Password'); return; }
    const { error } = await sb.auth.signInWithPassword({ email: info.email, password });
    if(error){ showLoginError(formEl, 'Invalid Employee ID or Password'); return; }
    await loadSessionAndProfile();
    render();
  } catch(e){
    showLoginError(formEl, e.message || 'Login failed. Please try again.');
  } finally {
    setLoading(btn, false, 'Login');
  }
}
function showLoginError(formEl, msg){
  const old = formEl.querySelector('.err-box'); if(old) old.remove();
  const div = document.createElement('div'); div.className='err-box'; div.textContent = msg;
  formEl.appendChild(div);
}
async function loadSessionAndProfile(){
  const { data: { session } } = await sb.auth.getSession();
  state.session = session;
  if(session){
    const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    state.profile = profile;
    const { data: sections } = await sb.from('sections').select('*').order('name');
    state.sections = sections || [];
  } else {
    state.profile = null;
  }
}
async function logout(){
  await sb.auth.signOut();
  state.session = null; state.profile = null;
  render();
}

/* ---------- render root ---------- */
function renderLogin(){
  app.innerHTML = `
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">BD</div>
      <div class="login-title">BD Brand Market</div>
      <div class="login-sub">Factory Management System</div>
      <form id="loginForm">
        <label>Employee ID</label>
        <input type="text" id="loginId" placeholder="e.g. CUT-001" autocapitalize="characters" />
        <label>Password</label>
        <input type="password" id="loginPw" placeholder="Password" />
        <button class="btn btn-primary" type="submit">Login</button>
      </form>
    </div>
  </div>`;
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    tryLogin(document.getElementById('loginId').value, document.getElementById('loginPw').value, e.target);
  });
}

function navItems(){
  return [
    {key:'dashboard', icon:'⌂', label:'Home'},
    {key:'stock', icon:'▣', label:'Stock'},
    {key:'requisition', icon:'☷', label:'Requisition'},
    {key:'history', icon:'◷', label:'History'},
  ];
}
function moreMenuItems(){
  const role = state.profile.role;
  const items = [];
  items.push({key:'machines', icon:'🛠️', label:'Machines & Repairs'});
  if(['super_admin','management'].includes(role)) items.push({key:'reports', icon:'📊', label:'Reports (coming next)'});
  if(role === 'super_admin') items.push({key:'users', icon:'👤', label:'User Management'});
  items.push({key:'logout', icon:'↪', label:'Logout'});
  return items;
}

function renderShell(bodyHtml, opts={}){
  const nav = navItems();
  app.innerHTML = `
    <div class="topbar">
      <div>
        <div class="title">${esc(opts.title || 'BD Brand Market')}</div>
        <div class="sub">${esc(state.profile.full_name)} · ${esc(state.profile.role)} · ${esc(sectionName(state.profile.section_id))}</div>
      </div>
      <button class="icon" id="moreBtn">☰</button>
    </div>
    <div class="content" id="content">${bodyHtml}</div>
    <div class="bottomnav">
      ${nav.map(n => `<a href="#/${n.key}" class="${state.route===n.key?'active':''}"><span class="ic">${n.icon}</span>${n.label}</a>`).join('')}
    </div>
  `;
  document.getElementById('moreBtn').onclick = openMoreMenu;
}
function openMoreMenu(){
  const items = moreMenuItems();
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.innerHTML = `<div class="sheet">
    <div class="sheet-head"><h2>Menu</h2><button class="close-x">✕</button></div>
    ${items.map(i => `<div class="menu-item" data-k="${i.key}"><span>${i.icon}</span><span>${esc(i.label)}</span></div>`).join('')}
  </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('.close-x').onclick = () => wrap.remove();
  wrap.onclick = (e) => { if(e.target === wrap) wrap.remove(); };
  wrap.querySelectorAll('.menu-item').forEach(el => el.onclick = () => {
    wrap.remove();
    const k = el.dataset.k;
    if(k === 'logout') return logout();
    if(k === 'reports') return toast('Reports page is coming in the next update.');
    location.hash = '#/' + k;
  });
}
function openSheet(title, innerHtml){
  const wrap = document.createElement('div');
  wrap.className = 'sheet-backdrop';
  wrap.innerHTML = `<div class="sheet">
    <div class="sheet-head"><h2>${esc(title)}</h2><button class="close-x">✕</button></div>
    <div class="sheet-body">${innerHtml}</div>
  </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('.close-x').onclick = () => wrap.remove();
  wrap.onclick = (e) => { if(e.target === wrap) wrap.remove(); };
  return wrap;
}

/* ---------- DASHBOARD ---------- */
async function renderDashboard(){
  renderShell(`<div class="grid2">
    ${[1,2,3,4].map(()=>`<div class="stat"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%"></div></div>`).join('')}
  </div>`, {title:'Dashboard'});
  const role = state.profile.role;
  const mySection = state.profile.section_id;

  let itemsQ = sb.from('items').select('id,current_stock,minimum_stock', {count:'exact'}).eq('is_active', true);
  let pendingQ = sb.from('requisitions').select('id', {count:'exact', head:true}).eq('status','pending');
  let approvedQ = sb.from('requisitions').select('id', {count:'exact', head:true}).eq('status','approved');
  let problemsQ = sb.from('machine_problems').select('id', {count:'exact', head:true}).in('status',['reported','assigned','in_progress']);

  if(role === 'section'){
    pendingQ = pendingQ.eq('section_id', mySection);
    approvedQ = approvedQ.eq('section_id', mySection);
    problemsQ = problemsQ.eq('section_id', mySection);
  }

  const [{ data: items }, { count: pendingCount }, { count: approvedCount }, { count: problemsCount }] =
    await Promise.all([itemsQ, pendingQ, approvedQ, problemsQ]);

  const lowStock = (items||[]).filter(i => Number(i.current_stock) <= Number(i.minimum_stock));

  const html = `
    <div class="grid2">
      <div class="stat"><div class="n">${(items||[]).length}</div><div class="l">Active Items</div></div>
      <div class="stat"><div class="n" style="color:${lowStock.length?'var(--danger)':'inherit'}">${lowStock.length}</div><div class="l">Low Stock</div></div>
      <div class="stat"><div class="n">${pendingCount ?? 0}</div><div class="l">Pending Requisition</div></div>
      <div class="stat"><div class="n">${approvedCount ?? 0}</div><div class="l">Approved (to issue)</div></div>
    </div>
    <div class="card ${problemsCount ? 'danger-left':''}" style="margin-top:12px;">
      <h2>Machine Problems</h2>
      <div class="muted">${problemsCount ?? 0} open problem(s) in queue</div>
      <button class="btn btn-outline btn-sm" style="width:100%;margin-top:10px;" onclick="location.hash='#/machines'">View Machine Queue</button>
    </div>
    <div class="card">
      <h2>Quick Actions</h2>
      <div class="row">
        ${['super_admin','store'].includes(role) ? `<button class="btn btn-primary btn-sm" id="qaAddStock" style="flex:1">+ Add Stock</button>`:''}
        <button class="btn btn-outline btn-sm" id="qaNewReq" style="flex:1">+ New Requisition</button>
      </div>
    </div>
  `;
  renderShell(html, {title:'Dashboard'});
  const addBtn = document.getElementById('qaAddStock'); if(addBtn) addBtn.onclick = openAddStockSheet;
  document.getElementById('qaNewReq').onclick = openCreateRequisitionSheet;
}

/* ---------- STOCK ---------- */
async function renderStock(){
  renderShell(`<div class="skel"></div><div class="skel"></div><div class="skel"></div>`, {title:'Stock'});
  const role = state.profile.role;
  const canManage = ['super_admin','store'].includes(role);
  const { data: items, error } = await sb.from('items').select('*').eq('is_active', true).order('name');

    </div>` : ''}
    <div class="card" style="margin-top:12px;">
      <h2>Items (${(items||[]).length})</h2>
      ${(items||[]).length ? (items||[]).map(i => {
        const low = Number(i.current_stock) <= Number(i.minimum_stock);

          <div><div class="name">${esc(i.name)}</div><div class="meta">${esc(i.item_code)} · ${esc(i.category||'—')} · Min: ${i.minimum_stock} ${esc(i.unit)}</div></div>
          <div style="text-align:right;">
            <div class="name" style="${low?'color:var(--danger)':''}">${i.current_stock} ${esc(i.unit)}</div>

function openAddStockSheet(){
  const html = `

/* ---------- REQUISITION ---------- */
let reqTab = 'all';
async function renderRequisition(){
  renderShell(`<div class="skel"></div><div class="skel"></div>`, {title:'Requisition'});
  const role = state.profile.role;
  let q = sb.from('requisitions').select('*, requisition_items(*, items(name, unit))').order('created_at', {ascending:false});
  if(role === 'section') q = q.eq('section_id', state.profile.section_id);
  if(reqTab !== 'all') q = q.eq('status', reqTab);
  const { data: reqs, error } = await q;
  if(error) toast(error.message, 'err');

  const tabs = ['all','pending','approved','issued','completed','rejected','cancelled'];
  const html = `
    <button class="btn btn-primary" id="newReqBtn">+ New Requisition</button>
    <div class="tabs" style="margin-top:14px;">
      ${tabs.map(t => `<div class="tab ${reqTab===t?'active':''}" data-t="${t}">${t}</div>`).join('')}
    </div>
    <div id="reqListWrap">
      ${(reqs||[]).length ? (reqs||[]).map(r => renderReqCard(r, role)).join('') : '<div class="empty">No requisitions found.</div>'}
    </div>
  `;
  renderShell(html, {title:'Requisition'});
  document.getElementById('newReqBtn').onclick = openCreateRequisitionSheet;
  document.querySelectorAll('.tab').forEach(el => el.onclick = () => { reqTab = el.dataset.t; renderRequisition(); });
  wireReqActions(role);
}
function renderReqCard(r, role){
  const items = (r.requisition_items||[]).map(ri => `${esc(ri.items?.name||'?')} × ${ri.requested_qty}${ri.approved_qty!=null?` (appr: ${ri.approved_qty})`:''}${ri.issued_qty!=null?` (issued: ${ri.issued_qty})`:''}`).join(', ');
  let actions = '';
  if(role === 'management' || role === 'super_admin'){
    if(r.status === 'pending') actions += `<button class="btn btn-primary btn-sm" data-act="approve" data-id="${r.id}">Approve</button><button class="btn btn-danger btn-sm" data-act="reject" data-id="${r.id}">Reject</button>`;
  }
  if(role === 'store' || role === 'super_admin'){
    if(r.status === 'approved') actions += `<button class="btn btn-primary btn-sm" data-act="issue" data-id="${r.id}">Issue</button>`;
  }
  if(role === 'store' || role === 'management' || role === 'super_admin'){
    if(r.status === 'issued') actions += `<button class="btn btn-primary btn-sm" data-act="complete" data-id="${r.id}">Complete</button>`;
  }
  if(['pending','approved'].includes(r.status) && (role === 'super_admin' || role === 'management' || role === 'store' || (role==='section' && r.requested_by === state.session.user.id))){
    actions += `<button class="btn btn-outline btn-sm" data-act="cancel" data-id="${r.id}">Cancel</button>`;
  }
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;">
      <div class="name">${esc(r.requisition_no)}</div>${badge(r.status)}
    </div>
    <div class="meta muted">${esc(sectionName(r.section_id))} · ${fmtDate(r.created_at)}</div>
    <div style="margin-top:8px;font-size:13px;">${items || '—'}</div>
    ${r.purpose ? `<div class="muted" style="margin-top:4px;">Purpose: ${esc(r.purpose)}</div>` : ''}
    ${r.rejection_reason ? `<div class="muted" style="margin-top:4px;color:var(--danger)">Rejected: ${esc(r.rejection_reason)}</div>` : ''}
    ${actions ? `<div class="row" style="margin-top:10px;flex-wrap:wrap;">${actions}</div>` : ''}
  </div>`;
}
function wireReqActions(role){
  document.querySelectorAll('[data-act]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.id, act = btn.dataset.act;
      try{
        if(act === 'approve'){
          setLoading(btn, true);
          await callRpc('update_requisition_status', { p_requisition_id:id, p_status:'approved', p_rejection_reason: null });
          toast('Requisition approved', 'ok');
        } else if(act === 'reject'){
          const reason = prompt('Rejection reason (required):');
          if(!reason || !reason.trim()){ toast('Rejection reason is required','err'); return; }
          setLoading(btn, true);
          await callRpc('update_requisition_status', { p_requisition_id:id, p_status:'rejected', p_rejection_reason: reason.trim() });
          toast('Requisition rejected', 'ok');
        } else if(act === 'issue'){
          setLoading(btn, true);
          await callRpc('issue_requisition', { p_requisition_id:id, p_reference_no: null, p_notes: null });
          toast('Requisition issued — stock updated', 'ok');
        } else if(act === 'complete'){
          setLoading(btn, true);
          await callRpc('complete_requisition', { p_requisition_id:id, p_notes: null });
          toast('Requisition completed', 'ok');
        } else if(act === 'cancel'){
          if(!confirm('Cancel this requisition?')) return;
          setLoading(btn, true);
          await callRpc('update_requisition_status', { p_requisition_id:id, p_status:'cancelled' });
          toast('Requisition cancelled', 'ok');
        }
        renderRequisition();
      } catch(err){ toast(err.message, 'err'); setLoading(btn,false,'...'); }
    };
  });
}
function openCreateRequisitionSheet(){
  const role = state.profile.role;
  const sectionOptions = state.sections.map(s => `<option value="${s.id}" ${s.id===state.profile.section_id?'selected':''}>${esc(s.name)}</option>`).join('');
  const sectionLocked = role === 'section';
  const html = `
    <label>Section</label>
    <select id="reqSection" ${sectionLocked?'disabled':''}>${sectionOptions}</select>
    <label>Purpose</label>
    <textarea id="reqPurpose" placeholder="Why is this needed?"></textarea>
    <div id="reqItemsWrap"></div>
    <button class="btn btn-outline btn-sm" id="addItemRow" style="width:100%;margin-top:8px;">+ Add another item</button>
    <button class="btn btn-primary" id="reqSubmit">Submit Requisition</button>
  `;
  const wrap = openSheet('New Requisition', html);
  const itemsWrap = wrap.querySelector('#reqItemsWrap');
  const rows = [];
  function addRow(){
    const rowId = 'row' + rows.length + '_' + Date.now();
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="ac-wrap">
        <label>Item</label>
        <input type="text" class="riName" placeholder="Search item" />
        <div class="ac-list riList" style="display:none;"></div>
      </div>
      <label>Requested Quantity</label>
      <input type="number" class="riQty" min="0.01" step="0.01" />
    `;
    itemsWrap.appendChild(div);
    const rowState = { itemId:null };
    attachAutocomplete(div.querySelector('.riName'), div.querySelector('.riList'), searchItems, (r) => {
      div.querySelector('.riName').value = r.raw.name; rowState.itemId = r.id;
    });
    rows.push({ el: div, state: rowState });
  }
  addRow();
  wrap.querySelector('#addItemRow').onclick = addRow;
  wrap.querySelector('#reqSubmit').onclick = async (e) => {
    const btn = e.target;
    const sectionId = wrap.querySelector('#reqSection').value;
    const purpose = wrap.querySelector('#reqPurpose').value.trim();
    const items = rows.map(r => ({
      item_id: r.state.itemId,
      requested_qty: parseFloat(r.el.querySelector('.riQty').value)
    })).filter(x => x.item_id && x.requested_qty > 0);
    if(!sectionId){ toast('Section is required','err'); return; }
    if(!items.length){ toast('Add at least one valid item with quantity','err'); return; }
    setLoading(btn, true);
    try{
      await callRpc('create_requisition', { p_section_id: sectionId, p_items: items, p_notes: purpose || null });
      toast('Requisition submitted', 'ok');
      wrap.remove();
      renderRequisition();
    } catch(err){ toast(err.message, 'err'); }
    finally{ setLoading(btn, false, 'Submit Requisition'); }
  };
}

          </div>
          <div style="text-align:right;">
            ${p.is_active ? '<span class="badge b-completed">Active</span>' : '<span class="badge b-rejected">Inactive</span>'}
            <div style="margin-top:6px;"><button class="btn btn-outline btn-sm" data-edit="${p.id}">Manage</button></div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
  renderShell(html, {title:'User Management'});
  document.getElementById('newEmpBtn').onclick = openCreateEmployeeSheet;
  document.querySelectorAll('[data-edit]').forEach(btn => btn.onclick = () => {
    const p = profiles.find(x => x.id === btn.dataset.edit);
    openManageEmployeeSheet(p);
  });
}
function openCreateEmployeeSheet(){
  const sectionOptions = state.sections.map(s => `<option value="${s.id}">${esc(s.name)} (${esc(s.code)})</option>`).join('');
  const html = `
    <label>Employee ID</label><input type="text" id="neId" placeholder="e.g. CUT-002" style="text-transform:uppercase;" />
    <label>Password</label><input type="text" id="nePw" placeholder="Set an initial password" />
    <label>Full Name</label><input type="text" id="neName" />
    <label>Designation</label><input type="text" id="neDesig" />
    <label>Section</label><select id="neSection">${sectionOptions}</select>
    <label>Role</label>
    <select id="neRole">
      <option value="section">Section</option>
      <option value="store">Store</option>
      <option value="mechanic">Mechanic</option>
      <option value="management">Management</option>
      <option value="super_admin">Super Admin</option>
    </select>
    <button class="btn btn-primary" id="neSubmit">Create Employee</button>
  `;
  const wrap = openSheet('Create Employee', html);
  wrap.querySelector('#neSubmit').onclick = async (e) => {
    const btn = e.target;
    const employeeId = wrap.querySelector('#neId').value.trim().toUpperCase();
    const password = wrap.querySelector('#nePw').value;
    const fullName = wrap.querySelector('#neName').value.trim();
    if(!employeeId || !password || !fullName){ toast('Employee ID, password and name are required','err'); return; }
    if(password.length < 6){ toast('Password must be at least 6 characters','err'); return; }
    setLoading(btn, true);
    try{
      await callFn('admin-employees', {
        action:'create', employee_id: employeeId, password, full_name: fullName,
        designation: wrap.querySelector('#neDesig').value.trim(),
        role: wrap.querySelector('#neRole').value,
        section_id: wrap.querySelector('#neSection').value,
      });
      toast('Employee account created', 'ok');
      wrap.remove();
      renderUsers();
    } catch(err){ toast(err.message,'err'); }
    finally{ setLoading(btn,false,'Create Employee'); }
  };
}
function openManageEmployeeSheet(p){
  const sectionOptions = state.sections.map(s => `<option value="${s.id}" ${s.id===p.section_id?'selected':''}>${esc(s.name)}</option>`).join('');
  const roles = ['section','store','mechanic','management','super_admin'];
  const html = `
    <div class="muted" style="margin-bottom:8px;">Employee ID: <b>${esc(p.employee_id)}</b></div>
    <label>Full Name</label><input type="text" id="meName" value="${esc(p.full_name)}" />
    <label>Designation</label><input type="text" id="meDesig" value="${esc(p.designation||'')}" />
    <label>Section</label><select id="meSection">${sectionOptions}</select>
    <label>Role</label>
    <select id="meRole">${roles.map(r=>`<option value="${r}" ${r===p.role?'selected':''}>${r}</option>`).join('')}</select>
    <label>Status</label>
    <select id="meActive"><option value="true" ${p.is_active?'selected':''}>Active</option><option value="false" ${!p.is_active?'selected':''}>Inactive</option></select>
    <button class="btn btn-primary" id="meSave">Save Changes</button>
    <button class="btn btn-outline" id="meResetPw">Reset Password</button>
  `;
  const wrap = openSheet('Manage Employee', html);
  wrap.querySelector('#meSave').onclick = async (e) => {
    const btn = e.target;
    setLoading(btn, true);
    try{
      await callRpc('admin_update_employee', {
        p_profile_id: p.id,
        p_full_name: wrap.querySelector('#meName').value.trim(),
        p_designation: wrap.querySelector('#meDesig').value.trim(),
        p_role: wrap.querySelector('#meRole').value,
        p_section_id: wrap.querySelector('#meSection').value,
        p_is_active: wrap.querySelector('#meActive').value === 'true',
      });
      toast('Employee updated', 'ok');
      wrap.remove();
      renderUsers();
    } catch(err){ toast(err.message,'err'); }
    finally{ setLoading(btn,false,'Save Changes'); }
  };
  wrap.querySelector('#meResetPw').onclick = async (e) => {
    const btn = e.target;
    const pw = prompt('Enter new password for ' + p.employee_id + ' (min 6 characters):');
    if(!pw) return;
    if(pw.length < 6){ toast('Password must be at least 6 characters','err'); return; }
    setLoading(btn, true);
    try{
      await callFn('admin-employees', { action:'reset_password', employee_id: p.employee_id, password: pw });
      toast('Password reset successfully', 'ok');
    } catch(err){ toast(err.message,'err'); }
    finally{ setLoading(btn,false,'Reset Password'); }
  };
}

/* ---------- router ---------- */
const routes = {
  dashboard: renderDashboard,
  stock: renderStock,
  requisition: renderRequisition,
  history: renderHistory,
  machines: renderMachines,
  users: renderUsers,
};
function render(){
  if(!state.session || !state.profile){ renderLogin(); return; }
  const hash = (location.hash || '#/dashboard').replace('#/','');
  state.route = routes[hash] ? hash : 'dashboard';
  routes[state.route]();
}
window.addEventListener('hashchange', render);

/* ---------- boot ---------- */
(async function boot(){
  app.innerHTML = `<div class="login-wrap"><span class="spinner dark"></span></div>`;
  await loadSessionAndProfile();
  render();
  sb.auth.onAuthStateChange((event) => {
    if(event === 'SIGNED_OUT'){ state.session = null; state.profile = null; render(); }
  });
})();
</script>
</body>
